<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iniciar Sesión — Dulces y Delicias del Valle, S.A.</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f2137 0%, #1a3c5e 50%, #234f7a 100%);
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .login-wrap {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  .login-card {
    background: #fff;
    border-radius: 20px;
    padding: 44px 40px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25);
  }

  .login-logo {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, #e87c34, #f5a55a);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 16px;
    box-shadow: 0 8px 20px rgba(232,124,52,0.35);
  }

  .login-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: #1e2d3d;
    text-align: center;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 12px;
    color: #6b7c8d;
    text-align: center;
    margin-bottom: 32px;
  }

  .form-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #6b7c8d;
    margin-bottom: 6px;
  }

  .form-control, .form-select {
    border: 1.5px solid #dce4ed;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-control:focus, .form-select:focus {
    border-color: #1a3c5e;
    box-shadow: 0 0 0 3px rgba(26,60,94,0.1);
  }

  .input-icon {
    position: relative;
  }

  .input-icon i {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #6b7c8d;
    font-size: 16px;
    z-index: 5;
  }

  .input-icon .form-control,
  .input-icon .form-select {
    padding-left: 40px;
  }

  .btn-toggle-pass {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: #6b7c8d; cursor: pointer;
    font-size: 16px; z-index: 5;
    padding: 0;
  }

  .btn-login {
    background: linear-gradient(135deg, #1a3c5e, #234f7a);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    width: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
    margin-top: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(26,60,94,0.3);
    color: #fff;
  }

  .btn-login:disabled {
    opacity: 0.7;
    transform: none;
  }

  .login-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
  }

  .error-box {
    background: #fdf0f0;
    border: 1px solid #f5c6c6;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #c0392b;
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .rol-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }

  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
  .shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">🍬</div>
    <div class="login-title">Dulces y Delicias del Valle</div>
    <div class="login-sub">Sistema Contable ERP · 2026 · Inicia sesión para continuar</div>

    <!-- Error box -->
    <div class="error-box" id="error-box">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="error-msg">Usuario o contraseña incorrectos.</span>
    </div>

    <!-- Formulario -->
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <div class="input-icon">
        <i class="bi bi-person"></i>
        <input type="text" id="inp-usuario" class="form-control"
          placeholder="Tu nombre de usuario" autocomplete="username">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <div class="input-icon" style="position:relative">
        <i class="bi bi-lock"></i>
        <input type="password" id="inp-password" class="form-control"
          placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter') iniciarSesion()">
        <button class="btn-toggle-pass" onclick="togglePass()" tabindex="-1">
          <i class="bi bi-eye" id="icon-eye"></i>
        </button>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Rol</label>
      <div class="input-icon">
        <i class="bi bi-shield-check"></i>
        <select id="inp-rol" class="form-select">
          <option value="">— Selecciona tu rol —</option>
          <option value="Gerente General">Gerente General</option>
          <option value="Contador">Contador</option>
          <option value="Vendedor / Asesor">Vendedor / Asesor</option>
          <option value="Bodeguero">Bodeguero</option>
          <option value="Piloto / Repartidor">Piloto / Repartidor</option>
        </select>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="iniciarSesion()">
      <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
    </button>

  </div>

  <div class="login-footer">
    © 2026 Dulces y Delicias del Valle, S.A. · Sistema Contable ERP
  </div>
</div>

<script>
const API = 'http://localhost/dulces-erp/erp-backend/api';

function togglePass() {
  const inp  = document.getElementById('inp-password');
  const icon = document.getElementById('icon-eye');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}

function mostrarError(msg) {
  const box = document.getElementById('error-box');
  document.getElementById('error-msg').textContent = msg;
  box.style.display = 'flex';
  document.querySelector('.login-card').classList.add('shake');
  setTimeout(() => document.querySelector('.login-card').classList.remove('shake'), 400);
}

function ocultarError() {
  document.getElementById('error-box').style.display = 'none';
}

async function iniciarSesion() {
  const usuario = document.getElementById('inp-usuario').value.trim();
  const password = document.getElementById('inp-password').value;
  const rol      = document.getElementById('inp-rol').value;

  ocultarError();

  if (!usuario || !password || !rol) {
    mostrarError('Completa todos los campos para continuar.');
    return;
  }

  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Verificando...';

  try {
    const res  = await fetch(`${API}/login.php`, {
      method : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body   : JSON.stringify({ usuario, password, rol })
    });
    const text = await res.text();
    const match = text.match(/\{[\s\S]*\}/);
    const data  = match ? JSON.parse(match[0]) : null;

    if (data?.ok) {
      // Guardar sesión en sessionStorage
      sessionStorage.setItem('erp_usuario', JSON.stringify({
        id     : data.id,
        nombre : data.nombre,
        usuario: data.usuario,
        rol    : data.rol,
      }));
      // Redirigir al sistema
      window.location.href = 'index.html';
    } else {
      mostrarError(data?.mensaje || 'Usuario, contraseña o rol incorrecto.');
    }
  } catch (err) {
    mostrarError('No se puede conectar con el servidor. Verifica que XAMPP esté activo.');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión';
}
</script>

</body>
</html>
