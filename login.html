<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Iniciar Sesión — Dulces y Delicias del Valle, S.A.</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fraunces:wght@700&display=swap" rel="stylesheet"/>
<style>
:root {
  --primary: #1a3c5e;
  --accent:  #e87c34;
  --border:  #dce4ed;
  --text:    #1e2d3d;
  --muted:   #6b7c8d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0f2137 0%, #1a3c5e 50%, #234f7a 100%);
}
.card {
  background: #fff;
  border-radius: 20px;
  padding: 44px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.25);
  margin: 20px;
}
.logo {
  width: 60px; height: 60px;
  background: linear-gradient(135deg, #e87c34, #f5a55a);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  margin: 0 auto 16px;
}
h1 { font-family: 'Fraunces', serif; font-size: 22px; color: var(--text); text-align: center; margin-bottom: 4px; }
.sub { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 28px; }
label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }
.field { position: relative; margin-bottom: 16px; }
.field i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }
.field input, .field select {
  width: 100%; padding: 12px 14px 12px 40px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif;
  outline: none; transition: border-color .2s;
}
.field input:focus, .field select:focus { border-color: var(--primary); }
.eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; }
.btn-main {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--primary), #234f7a);
  color: #fff; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: opacity .2s, transform .2s;
  margin-top: 4px;
}
.btn-main:hover { opacity: .9; transform: translateY(-1px); }
.btn-main:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn-sec {
  width: 100%; padding: 11px;
  background: none; border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; cursor: pointer; color: var(--muted); margin-top: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.btn-link { background: none; border: none; color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; padding: 0 4px; }
.error { background: #fdf0f0; border: 1px solid #f5c6c6; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #c0392b; margin-bottom: 14px; display: none; }
.success { background: #f0fdf4; border: 1px solid #86efac; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #166534; margin-bottom: 14px; display: none; }
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.footer { text-align: center; margin-top: 20px; font-size: 11px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🍬</div>
  <h1>Dulces y Delicias del Valle</h1>
  <p class="sub">Sistema Contable ERP · 2026 · Inicia sesión para continuar</p>

  <!-- MENSAJES -->
  <div class="error" id="msg-error"></div>
  <div class="success" id="msg-ok"></div>

  <!-- ── PANEL LOGIN ── -->
  <div id="panel-login">
    <div class="field">
      <label>Usuario</label>
      <i class="bi bi-person"></i>
      <input type="text" id="inp-user" placeholder="Tu usuario" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <i class="bi bi-lock"></i>
      <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password"/>
      <button class="eye" type="button" onclick="togglePass('inp-pass','eye1')"><i id="eye1" class="bi bi-eye"></i></button>
    </div>
    <div class="field">
      <label>Rol</label>
      <i class="bi bi-shield-check"></i>
      <select id="inp-rol">
        <option value="">— Selecciona tu rol —</option>
        <option value="Gerente General">Gerente General</option>
        <option value="Contador">Contador</option>
        <option value="Vendedor / Asesor">Vendedor / Asesor</option>
        <option value="Bodeguero">Bodeguero</option>
        <option value="Piloto / Repartidor">Piloto / Repartidor</option>
      </select>
    </div>
    <button class="btn-main" id="btn-login" onclick="iniciarSesion()">
      <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
    </button>
    <div style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted)">
      ¿No tienes cuenta?
      <button class="btn-link" onclick="mostrarPanel('registro')">Crear cuenta</button>
    </div>
  </div>

  <!-- ── PANEL REGISTRO ── -->
  <div id="panel-registro" style="display:none">
    <hr class="divider">
    <p style="font-size:13px;font-weight:700;color:var(--text);text-align:center;margin-bottom:16px">
      <i class="bi bi-person-plus" style="color:var(--accent)"></i> Crear nueva cuenta
    </p>
    <div class="field">
      <label>Nombre Completo</label>
      <i class="bi bi-person-badge"></i>
      <input type="text" id="reg-nombre" placeholder="Tu nombre completo"/>
    </div>
    <div class="field">
      <label>Usuario</label>
      <i class="bi bi-at"></i>
      <input type="text" id="reg-user" placeholder="Nombre de usuario único"/>
    </div>
    <div class="field">
      <label>Contraseña</label>
      <i class="bi bi-lock"></i>
      <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"/>
      <button class="eye" type="button" onclick="togglePass('reg-pass','eye2')"><i id="eye2" class="bi bi-eye"></i></button>
    </div>
    <div class="field">
      <label>Rol</label>
      <i class="bi bi-shield-check"></i>
      <select id="reg-rol">
        <option value="">— Selecciona tu rol —</option>
        <option value="Gerente General">Gerente General</option>
        <option value="Contador">Contador</option>
        <option value="Vendedor / Asesor">Vendedor / Asesor</option>
        <option value="Bodeguero">Bodeguero</option>
        <option value="Piloto / Repartidor">Piloto / Repartidor</option>
      </select>
    </div>
    <button class="btn-main" id="btn-reg" onclick="registrar()" style="background:linear-gradient(135deg,var(--accent),#f5a55a)">
      <i class="bi bi-person-check me-2"></i> Crear Cuenta
    </button>
    <button class="btn-sec" onclick="mostrarPanel('login')">← Volver al login</button>
  </div>
</div>

<p class="footer">© 2026 Dulces y Delicias del Valle, S.A.</p>

<script>
const API = 'https://dulces-erp-production.up.railway.app/erp-backend/api';

// ── Helpers ─────────────────────────────────────────────
function togglePass(inputId, iconId) {
  var inp  = document.getElementById(inputId);
  var icon = document.getElementById(iconId);
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}

function mostrarPanel(panel) {
  document.getElementById('panel-login').style.display    = panel === 'login'    ? 'block' : 'none';
  document.getElementById('panel-registro').style.display = panel === 'registro' ? 'block' : 'none';
  limpiarMensajes();
}

function mostrarError(msg) {
  var el = document.getElementById('msg-error');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('msg-ok').style.display = 'none';
}

function mostrarOk(msg) {
  var el = document.getElementById('msg-ok');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('msg-error').style.display = 'none';
}

function limpiarMensajes() {
  document.getElementById('msg-error').style.display = 'none';
  document.getElementById('msg-ok').style.display    = 'none';
}

function setBtnLoading(id, loading, texto) {
  var btn = document.getElementById(id);
  btn.disabled = loading;
  btn.innerHTML = loading
    ? '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Espera...'
    : texto;
}

// ── Login ────────────────────────────────────────────────
function iniciarSesion() {
  limpiarMensajes();

  var usuario = document.getElementById('inp-user').value.trim();
  var password = document.getElementById('inp-pass').value;
  var rol      = document.getElementById('inp-rol').value;

  if (!usuario || !password || !rol) {
    mostrarError('Completa todos los campos.');
    return;
  }

  setBtnLoading('btn-login', true, '');

  fetch(API + '/login.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ usuario: usuario, password: password, rol: rol })
  })
  .then(function(res) { return res.text(); })
  .then(function(text) {
    var data = null;
    try {
      var match = text.match(/\{[\s\S]*\}/);
      data = match ? JSON.parse(match[0]) : null;
    } catch(e) {
      mostrarError('Error al procesar respuesta del servidor.');
      setBtnLoading('btn-login', false, '<i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión');
      return;
    }

    if (data && data.ok) {
      sessionStorage.setItem('erp_usuario', JSON.stringify({
        id:      data.id,
        nombre:  data.nombre,
        usuario: data.usuario,
        rol:     data.rol
      }));
      window.location.href = 'index.html';
    } else {
      mostrarError(data ? data.mensaje : 'Error desconocido.');
      setBtnLoading('btn-login', false, '<i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión');
    }
  })
  .catch(function(err) {
    mostrarError('No se pudo conectar. ¿Está XAMPP activo?');
    setBtnLoading('btn-login', false, '<i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión');
    console.error(err);
  });
}

// ── Registro ─────────────────────────────────────────────
function registrar() {
  limpiarMensajes();

  var nombre   = document.getElementById('reg-nombre').value.trim();
  var usuario  = document.getElementById('reg-user').value.trim();
  var password = document.getElementById('reg-pass').value;
  var rol      = document.getElementById('reg-rol').value;

  if (!nombre || !usuario || !password || !rol) {
    mostrarError('Completa todos los campos.');
    return;
  }
  if (password.length < 6) {
    mostrarError('La contraseña debe tener al menos 6 caracteres.');
    return;
  }

  setBtnLoading('btn-reg', true, '');

  fetch(API + '/usuarios.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nombre: nombre, usuario: usuario, password: password, rol: rol })
  })
  .then(function(res) { return res.text(); })
  .then(function(text) {
    var data = null;
    try {
      var match = text.match(/\{[\s\S]*\}/);
      data = match ? JSON.parse(match[0]) : null;
    } catch(e) {}

    if (data && data.ok) {
      sessionStorage.setItem('erp_usuario', JSON.stringify({
        id: data.id, nombre: nombre, usuario: usuario, rol: rol
      }));
      window.location.href = 'index.html';
    } else {
      mostrarError(data ? data.mensaje : 'No se pudo crear la cuenta.');
      setBtnLoading('btn-reg', false, '<i class="bi bi-person-check me-2"></i> Crear Cuenta');
    }
  })
  .catch(function(err) {
    mostrarError('Error de conexión.');
    setBtnLoading('btn-reg', false, '<i class="bi bi-person-check me-2"></i> Crear Cuenta');
    console.error(err);
  });
}

// Enter en contraseña dispara login
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('inp-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') iniciarSesion();
  });
  document.getElementById('reg-pass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') registrar();
  });
});
</script>

</body>
</html>
